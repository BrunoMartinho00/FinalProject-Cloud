services:
  # Zookeeper (Obrigatório para gerir o Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Kafka (A fila de mensagens)
  kafka:
    image: confluentinc/cp-kafka:7.3.2
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_HEAP_OPTS: -Xmx256M -Xms128M
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    image: app-order-service
    restart: always
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m
      - SPRING_DATASOURCE_URL=jdbc:postgresql://projeto-final-db-tf.c87oyyuuqyrd.us-east-1.rds.amazonaws.com:5432/postgres
      - SPRING_DATASOURCE_USERNAME=app_user
      - SPRING_DATASOURCE_PASSWORD=passwordSuperSegura123!
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SERVER_PORT=8083
      - SERVER_ADDRESS=0.0.0.0
      - KAFKA_URL=kafka:9092
    depends_on:
      - kafka

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    image: app-product-service
    restart: always
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m
      - SPRING_DATASOURCE_URL=jdbc:postgresql://projeto-final-db-tf.c87oyyuuqyrd.us-east-1.rds.amazonaws.com:5432/postgres
      - SPRING_DATASOURCE_USERNAME=app_user
      - SPRING_DATASOURCE_PASSWORD=passwordSuperSegura123!
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SERVER_PORT=8082
      - SERVER_ADDRESS=0.0.0.0
      - KAFKA_URL=kafka:9092
    depends_on:
      - kafka

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: app-user-service
    restart: always
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m
      - SPRING_DATASOURCE_URL=jdbc:postgresql://projeto-final-db-tf.c87oyyuuqyrd.us-east-1.rds.amazonaws.com:5432/postgres
      - SPRING_DATASOURCE_USERNAME=app_user
      - SPRING_DATASOURCE_PASSWORD=passwordSuperSegura123!
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SERVER_PORT=8081
      - SERVER_ADDRESS=0.0.0.0
      - LOGGING_LEVEL_ROOT=DEBUG

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:8080"
    depends_on:
      - user-service
      - product-service
      - order-service
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m