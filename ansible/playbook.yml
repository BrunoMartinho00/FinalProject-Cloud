---
- name: Configurar Servidor e Correr Microsservicos
  hosts: web
  become: yes
  tasks:
    - name: Atualizar pacotes do sistema
      apt:
        update_cache: yes

    - name: Verificar estrutura de ficheiros no servidor
      shell: ls -R /home/ubuntu/app
      register: dir_content

    - name: Mostrar estrutura (Debug)
      debug:
        var: dir_content.stdout_lines

    - name: Instalar dependencias (Docker, Compose, Git)
      apt:
        name: [docker.io, docker-compose, git]
        state: present

    - name: Garantir que o servico do Docker esta a correr
      service:
        name: docker
        state: started
        enabled: yes

    - name: Adicionar o utilizador ubuntu ao grupo docker
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Criar pasta da app no servidor
      file:
        path: /home/ubuntu/app
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Copiar todo o projeto para a EC2 via shell
      shell: rsync -av --exclude='.git' --exclude='.terraform' --exclude='ansible' --exclude='*.pem' ../ /home/ubuntu/app/

    - name: Fazer Build e Correr os Contentores
      become: yes
      become_user: ubuntu
      shell: |
        # Encontra onde está o docker-compose e executa
        cd /home/ubuntu/app
        # Se ele criar uma subpasta, o comando abaixo vai encontrá-lo
        find . -maxdepth 2 -name "docker-compose.yml" -execdir docker-compose up --build -d \;