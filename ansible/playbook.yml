- name: Configurar Servidor de Produção
  hosts: ec2
  become: yes
  tasks:
    - name: Atualizar pacotes
      apt:
        update_cache: yes

    - name: Instalar Docker e dependências
      apt:
        name: [docker.io, docker-compose-v2, python3-pip]
        state: present

    - name: Configurar Swap (4GB)
      shell: |
        if [ ! -f /swapfile ]; then
          fallocate -l 4G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
        fi
      args:
        executable: /bin/bash

    - name: Garantir pasta da App
      file:
        path: /home/ubuntu/app
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Copiar código fonte para o servidor
      synchronize:
        src: ../
        dest: /home/ubuntu/app/
        recursive: yes
        delete: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=terraform"
          - "--exclude=ansible"
          - "--exclude=target"

    - name: Ajustar permissões da pasta
      file:
        path: /home/ubuntu/app
        owner: ubuntu
        group: ubuntu
        recurse: yes

    - name: Dar permissão ao utilizador ubuntu para o Docker
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Arrancar a App
      shell: docker compose up -d --build > docker_boot.log 2>&1
      args:
        chdir: /home/ubuntu/app/