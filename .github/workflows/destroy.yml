name: Destroy Infrastructure

# O 'workflow_dispatch' é a magia que cria o botão manual no GitHub
on:
  workflow_dispatch: 

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    
    # Segurança OIDC: Permite obter um token temporário em vez de usar chaves estáticas.
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: ./terraform

    # Fazer o download do código
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Assume permissões temporárias na AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }} # Ou usa o AWS_ACCESS_KEY_ID se for o caso
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Terraform Init
        run: terraform init # Liga-se ao ficheiro de estado remoto (S3)

      - name: Terraform Destroy
        run: terraform destroy -auto-approve # Destrói tudo automaticamente (sem prompt humano)
        # Injeção segura das variáveis necessárias para a destruição
        env:
          TF_VAR_aws_region: "us-east-1"
          TF_VAR_key_name: "projeto-final-key"
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}