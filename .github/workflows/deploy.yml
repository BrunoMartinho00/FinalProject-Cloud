name: Deploy Infra & Application

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitignore'

jobs:
  deploy:
    name: Terraform Apply & Ansible Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Inject DB Password (.env)
        run: |
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > .env

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform Init & Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve
        
      - name: Extract EC2 IP from Terraform
        id: tf_output
        run: |
          cd terraform
          EC2_IP=$(terraform output -raw ec2_public_ip)
          echo "ec2_ip=$EC2_IP" >> $GITHUB_ENV

      - name: Setup SSH Key and Inventory
        run: |
          mkdir -p terraform
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > terraform/projeto-final-key.pem
          chmod 600 terraform/projeto-final-key.pem
          
          # Criar o inventory.ini com o NOVO IP extraído do Terraform
          mkdir -p ansible
          echo "[ec2]" > ansible/inventory.ini
          echo "${{ env.ec2_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=../terraform/projeto-final-key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> ansible/inventory.ini

      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          cd ansible
          # Pausa de 30s para garantir que a EC2 recém-criada ligou o serviço SSH
          sleep 30 
          ansible-playbook -i inventory.ini playbook.yml